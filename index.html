<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="פיננסי משפחת דראי" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>תכנון פיננסי משפחת דראי</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: linear-gradient(160deg, #0d9488, #0f766e);
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #splash.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #splash img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
        animation: splash-pop 0.5s ease;
      }
      #splash span {
        font-family: -apple-system, "Segoe UI", Arial, sans-serif;
        font-size: 17px;
        font-weight: 700;
        color: #f0fdfa;
        letter-spacing: 0.01em;
      }
      #splash .spinner {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2.5px solid rgba(255, 255, 255, 0.35);
        border-top-color: #ffffff;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-pop {
        from { transform: scale(0.85); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img { animation: none; }
        #splash .spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/icon-192.png" alt="" />
      <span>תכנון פיננסי משפחת דראי</span>
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
